#-----------------------------------------------------------------------------#
#                                                                             #
#      DEFAULT CONFIGURATION FILE TO BE USED WITH THE FLASHWRITER SCRIPT      #
#                                                                             #
#-----------------------------------------------------------------------------#
#
# By default this config file,
# - The application image points to relative path of the hello_world application image for this EVM
#   - Make sure this application is built before running this script
# - You can customized this config file to point to your own application images
#

# When sending application image, flashing at offset 0x81000 using .mcelf format
# NOTE: Application image must start from 0x70080000 in memory. All ENET applications use this same start address.
# For other applications, please verify and ensure they also use the same start address from 0x70080000.
--file=../../source/networking/enet/core/examples/lwip/enet_lwip_cpsw/am263px-cc-dp83869/am263px-cc/r5fss0-0_freertos/ti-arm-clang/enet_lwip_cpsw.release.mcelf --operation=flash-sector-write --flash-offset=0x81000
